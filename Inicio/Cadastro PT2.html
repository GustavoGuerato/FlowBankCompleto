<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Bank - Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/7.2.1/css/flag-icons.min.css" />
    
    <link rel="stylesheet" href="Cadastro PT2.css" />
</head>

<body>
    
    <div class="register-page">

        <header>
            <div class="logo-area">
                <img class="logo-img" src="../Imagem/Logo.png" alt="Logo Flow Bank">
            </div>
        </header>

        <main class="register-content">
            <h1>VAMOS COMEÇAR?</h1>
            
            <div class="progress-bar">
                <div class="step active"></div>
                <div class="step active"></div>
            </div>

            <div class="register-box">
                <form>
                    <div class="form-grupo">
                        <div class="input-icon-wrapper">
                            <select class="input-form" id="pais-select" required>
                                <option value="br">Brasil</option>
                                <option value="us">Estados Unidos</option>
                                <option value="pt">Portugal</option>
                                <option value="ar">Argentina</option>
                                <option value="jp">Japão</option>
                                </select>
                            
                            <span id="pais-flag" class="fi fi-br input-icon"></span>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <input type="tel" class="input-form" placeholder="Numero de Telefone" required>
                    </div>

                    <div class="action-buttons">
                        <a href="#" class="btn btn-secondary">Voltar</a>
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
        </main>

    </div> <script>
        // Seleciona o <select> e o <span> da bandeira
        const paisSelect = document.getElementById('pais-select');
        const paisFlag = document.getElementById('pais-flag');

        // Adiciona um "ouvinte" que espera o usuário mudar o país
        paisSelect.addEventListener('change', function() {
            // Pega o código do país do <option> selecionado (ex: "br", "us")
            // e converte para minúsculo.
            const countryCode = this.value.toLowerCase();
            
            // Atualiza a classe do <span> da bandeira.
            // Ex: "fi fi-br" ou "fi fi-us"
            paisFlag.className = 'fi fi-' + countryCode + ' input-icon';
        });
    </script>

</body>
</html>
