<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Bank - Cadastro</title>
    <link rel="stylesheet" href="Cadastro PT1.css" />
</head>

<body>

    <div class="register-page">

        <header>
            <div class="logo-area">
                <img class="logo-img" src="../Imagem/Logo.png" alt="Logo Flow Bank">
            </div>
        </header>

        <main class="register-content">
            <h1>CRIE SUA CONTA</h1>

            <div class="progress-bar">
                <div class="step active"></div>
                <div class="step"></div>
            </div>

            <div class="register-box">
                <form id="form-pt1">

                    <div class="form-grupo">
                        <input id="email" type="email" class="input-form" placeholder="Seu email" required>
                    </div>

                    <div class="form-grupo">
                        <input id="senha" type="password" class="input-form" placeholder="Senha" required>
                    </div>

                    <div class="action-buttons">
                        <a href="login.html" class="btn btn-secondary">Voltar</a><a href="Cadastro PT2.html"><button
                                type="submit" class="btn btn-primary">Continuar</button></a>

                    </div>

                </form>
            </div>
        </main>

    </div>

    <script>
        document.getElementById("form-pt1").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value.trim();

            // Envia para o backend REAL
            const resp = await fetch("http://localhost:8080/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email,
                    password: senha
                })
            });

            const data = await resp.json();

            if (!resp.ok || !data.token) {
                alert(data.message || "Erro ao registrar.");
                return;
            }

            // Sucesso → salva token
            sessionStorage.setItem("token", data.token);

            // Vai para a etapa 2
            window.location.href = "Cadastro PT2.html";
        });
    </script>

</body>

</html>
